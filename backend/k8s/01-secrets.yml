# ============================================================
# PLANTILLA — No subas valores reales a GitHub.
# Antes de aplicar, reemplaza cada PLACEHOLDER con el valor
# real codificado en base64:
#   echo -n "mi_valor_real" | base64
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: inventory-system
type: Opaque
data:
  # echo -n "tu_usuario_mysql" | base64
  username: REEMPLAZAR_BASE64
  # echo -n "tu_password_mysql" | base64
  password: REEMPLAZAR_BASE64
  # echo -n "inventory" | base64
  database: aW52ZW50b3J5

---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: inventory-system
type: Opaque
data:
  # echo -n "tu_usuario_rabbitmq" | base64
  username: REEMPLAZAR_BASE64
  # echo -n "tu_password_rabbitmq" | base64
  password: REEMPLAZAR_BASE64

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: inventory-system
type: Opaque
data:
  # Genera una clave segura: openssl rand -hex 32
  # Luego codifícala: echo -n "tu_clave_generada" | base64
  secret-key: REEMPLAZAR_BASE64

---
apiVersion: v1
kind: Secret
metadata:
  name: aws-secret
  namespace: inventory-system
type: Opaque
data:
  # echo -n "tu_aws_access_key" | base64
  access-key: REEMPLAZAR_BASE64
  # echo -n "tu_aws_secret_key" | base64
  secret-key: REEMPLAZAR_BASE64
