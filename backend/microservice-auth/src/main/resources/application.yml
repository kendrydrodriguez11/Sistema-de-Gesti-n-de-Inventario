logging:
  level:
    root: INFO
    com.example.auth: DEBUG

server:
  port: 8081

spring:
  application:
    name: msvc-auth

  data:
    redis:
      host: ${REDIS_HOST:redis-service}
      port: ${REDIS_PORT:6379}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql-service}:${MYSQL_PORT:3306}/${MYSQL_DB:inventory}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
      database: mysql
      database-platform: org.hibernate.MySQL8Dialect

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq-service}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  time:
    expiration: ${JWT_EXPIRATION:3600000}
  secret:
    key: ${JWT_SECRET}

aws:
  access:
    key: ${AWS_ACCESS_KEY}
  secret:
    key: ${AWS_SECRET_KEY}
  region: ${AWS_REGION:us-east-1}
